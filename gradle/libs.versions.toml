[versions]
agp = "9.5.1"
kotlin = "2.4.21"
okhttp = "5.5.1"
jsoup = "1.24.1"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
injekt = "1.16.1"
rxjava = "1.3.8"
androidx-preference = "1.2.1"
aniyomi-extensions-lib = "v16"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
injekt = { module = "uy.kohesive.injekt:injekt-core", version.ref = "injekt" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
androidx-preference = { module = "androidx.preference:preference-ktx", version.ref = "androidx-preference" }
aniyomi-extensions-lib = { module = "com.github.aniyomiorg:extensions-lib", version.ref = "aniyomi-extensions-lib" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
